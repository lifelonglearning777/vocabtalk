<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCFCFA">
<title>Vocabulary Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Vocabulary Talk — design tokens
   Palette lifted directly from PICKS' own light "sheet" tokens
   (paper / ink / gold-teal / rule) so this reads as a sibling app,
   just built on the light side of PICKS' palette instead of the dark
   shell. No new colors invented.
   ===================================================================== */
:root{
  --paper:#FCFCFA; --paper-2:#F3F4EF; --paper-3:#EAEBE4;
  --ink:#14181F; --ink-soft:#4A515C; --ink-dim:#8A93A0;
  --rule:#E1E4DC;
  --teal:#14B8A6; --teal-2:#2DD4BF; --teal-soft:#E1F7F3; --teal-ink:#0B5C52;
  --blue:#4A5FA0; --blue-soft:#EAF0FF; --blue-ink:#1B3E99;
  --amber:#FBBF24; --amber-soft:#FEF3D8; --amber-ink:#8A6008;
  --red:#FF4D3D; --red-soft:#FFE9E6;
  --ok:#1FA971; --ok-soft:#EAF7F0;
  --r:14px; --r-lg:22px;
  --fs:16px; --lh:1.6;
  --shadow-sm:0 1px 2px rgba(20,24,31,.06), 0 1px 1px rgba(20,24,31,.04);
  --shadow-md:0 6px 20px rgba(20,24,31,.08);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%;height:100%}
img,svg{max-width:100%;display:block}
body{
  font-family:"BIZ UDPGothic","Andika",system-ui,sans-serif;
  color:var(--ink); line-height:var(--lh); min-height:100vh;
  background:var(--paper);
}
body.reduce-motion *{animation:none!important;transition:none!important}
.en{font-family:"Andika","BIZ UDPGothic",sans-serif}
.mono{font-family:"Space Mono",ui-monospace,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--teal-2);outline-offset:3px;border-radius:6px}
::selection{background:rgba(20,184,166,.22)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.eyebrow{
  font-family:"Space Mono",monospace;font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-dim);
}

/* =====================================================================
   App shell
   ===================================================================== */
#app{min-height:100vh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1.4rem;border-bottom:1px solid var(--rule);
  background:var(--paper);
}
.brand{display:flex;align-items:baseline;gap:.55rem;cursor:pointer}
.brand:hover .wordmark{color:var(--teal-ink)}
.brand .wordmark{
  font-family:"Space Grotesk","Andika",sans-serif;font-weight:700;
  font-size:1.3rem;letter-spacing:.06em;color:var(--ink);
}
.brand .wordmark .dot{color:var(--teal)}
.brand .sub{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.16em;color:var(--ink-dim);text-transform:uppercase}
.topbar nav{display:flex;gap:.4rem}
.topbar nav button{
  font-family:"Space Mono",monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.5rem .85rem;border-radius:999px;color:var(--ink-soft);
}
.topbar nav button:hover{background:var(--paper-2)}
.topbar nav button.on{background:var(--teal-soft);color:var(--teal-ink)}

main{flex:1;min-height:0;display:flex;flex-direction:column}

/* =====================================================================
   Buttons
   ===================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  font-family:"BIZ UDPGothic",sans-serif;font-weight:700;font-size:.95rem;
  padding:.72rem 1.3rem;border-radius:12px;transition:transform .12s ease, background .15s ease;
  border:1.5px solid transparent;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-ink)}
.btn-outline{background:var(--paper);border-color:var(--rule);color:var(--ink)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn-ghost{color:var(--ink-soft)}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:.4rem .75rem;font-size:.78rem;border-radius:9px}
.btn-lg{padding:1rem 1.9rem;font-size:1.08rem;border-radius:14px}

/* icon-only round buttons — used throughout Presentation mode, no text labels */
.icon-btn{
  width:50px;height:50px;border-radius:50%;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink);
  transition:transform .12s ease, background .15s ease, border-color .12s ease;
}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.3}
.icon-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.icon-btn.primary:hover{background:var(--teal-ink);border-color:var(--teal-ink)}
.icon-btn.ghost{border-color:transparent;background:transparent;color:var(--ink-dim)}
.icon-btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.icon-btn.outline:hover{border-color:var(--teal);color:var(--teal-ink)}
.icon-btn.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.icon-btn-sm{width:38px;height:38px}
.icon-btn-sm svg{width:18px;height:18px}

/* segmented control (never a native <select> for choices) */
.segmented{display:inline-flex;background:var(--paper-2);border-radius:11px;padding:.22rem;gap:.15rem}
.segmented button{
  font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.5rem .9rem;border-radius:8px;color:var(--ink-soft);
}
.segmented button.on{background:#fff;color:var(--teal-ink);box-shadow:var(--shadow-sm)}

/* =====================================================================
   Cards (compact, square-ish selection tiles — never long horizontal bars)
   ===================================================================== */
.tile{
  background:#fff;border:1.5px solid var(--rule);border-radius:var(--r);
  padding:.9rem .9rem .8rem;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:.35rem;
  transition:border-color .12s ease, box-shadow .12s ease, background .12s ease;
}
.tile:hover{border-color:var(--teal-2);box-shadow:var(--shadow-sm)}
.tile.picked{border-color:var(--teal);background:var(--teal-soft)}
.tile .tile-word{font-family:"Andika",sans-serif;font-weight:700;font-size:1.08rem;color:var(--ink)}
.tile .tile-ja{font-size:.82rem;color:var(--ink-soft)}
.tile .tile-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.15rem}
.tag{
  font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;
  padding:.14rem .5rem;border-radius:999px;background:var(--paper-2);color:var(--ink-dim);
}
.tile.picked .tag{background:#fff}
.tile-check{
  align-self:flex-end;width:1.3rem;height:1.3rem;border-radius:50%;
  border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;
  position:absolute;top:.6rem;right:.6rem;background:#fff;
}
.tile{position:relative}
.tile.picked .tile-check{background:var(--teal);border-color:var(--teal)}
.tile.picked .tile-check::after{content:"";width:.55rem;height:.32rem;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem}

/* =====================================================================
   Presentation mode — this is the screen students actually watch.
   No admin chrome. No secondary text. One thing at a time, huge.
   ===================================================================== */
.stage{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.2rem 2rem;text-align:center;position:relative;background:var(--paper);
  overflow:hidden;
}
.stage-progress{
  position:absolute;top:1.1rem;left:1.3rem;
  font-family:"Space Mono",monospace;font-size:.85rem;color:var(--ink-dim);
}
.stage-exit{position:absolute;top:.8rem;right:1rem}

.scene-frame{
  width:auto;height:min(52vh,560px);aspect-ratio:16/9;max-width:82vw;
  border-radius:var(--r-lg);
  background:var(--paper-2);border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:var(--shadow-md);
}
.scene-frame img{width:100%;height:100%;object-fit:cover}
.scene-placeholder{display:flex;flex-direction:column;align-items:center;gap:.6rem;color:var(--ink-dim)}
.scene-placeholder svg{width:64px;height:64px;opacity:.5}
.scene-placeholder span{font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}

.reveal-word{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--ink);
  font-size:clamp(3rem,7vw,6rem);line-height:1.2;letter-spacing:.025em;
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;
}
.reveal-word .ja{
  display:block;font-family:"BIZ UDPGothic",sans-serif;font-weight:700;
  font-size:clamp(1.1rem,2.4vw,1.7rem);color:var(--ink-soft);margin-top:1.1rem;
}
.reveal-model{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--ink);
  font-size:clamp(2.6rem,6.5vw,5.2rem);line-height:1.25;letter-spacing:.018em;
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;
  max-width:88vw;text-wrap:balance;
}
.reveal-chunk{
  font-family:"Space Mono",monospace;font-size:clamp(1.15rem,2.4vw,1.7rem);
  letter-spacing:.03em;color:var(--teal-ink);text-transform:none;margin-bottom:.8rem;
}

.which-row{
  display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));
  gap:.65rem;width:min(96vw,1500px);
}
.which-cell{
  display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:0;
  border-radius:20px;padding:.55rem .55rem .65rem;
}
.which-cell-frame{
  width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
}
.which-cell-frame img{width:100%;height:100%;object-fit:contain;background:#fff}
.which-cell-frame.photo-reveal{animation:photoReveal .35s ease both}
.which-cell-frame .scene-placeholder svg{width:34px;height:34px;color:var(--ink-dim)}
.which-word{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--ink);
  font-size:clamp(1.3rem,2.4vw,2.1rem);line-height:1.15;text-align:center;
}

.ideas-wrap{display:flex;flex-direction:column;align-items:center;gap:1.2rem;max-width:80vw}
.which-image-frame{
  width:min(58vw,680px);aspect-ratio:16/9;border-radius:var(--r-lg);
  background:var(--paper-2);border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.which-image-frame img{width:100%;height:100%;object-fit:contain;background:#fff}
.which-image-frame .scene-placeholder svg{width:38px;height:38px}
.idea-answer{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--teal-ink);
  background:var(--teal-soft);font-size:clamp(2.2rem,5vw,4rem);
  padding:.4rem 1.5rem;border-radius:20px;
}
.idea-list{display:flex;flex-direction:column;align-items:center;gap:.8rem}
.idea-line{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--ink);
  font-size:clamp(1.3rem,2.6vw,2rem);
}

.stage-controls{
  display:flex;align-items:center;gap:.5rem;padding:1rem 1.2rem;
  border-top:1px solid var(--rule);background:var(--paper);flex-wrap:wrap;justify-content:center;
}
.ctrl-slot{width:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage-controls .btn{font-size:.9rem;padding:.6rem 1.1rem}
.stage-controls .divider{width:1px;height:1.6rem;background:var(--rule);margin:0 .3rem}

/* teacher-only hint — small popover anchored above the hint button.
   Deliberately NOT full-width/fixed: it stays local to the control bar
   so it can never sit over the exit button or shift its hit target. */
.stage-controls{position:relative}
.helper-anchor{position:relative;display:inline-flex}
.control-note{
  position:absolute;left:calc(100% + .55rem);top:50%;transform:translateY(-50%);
  width:max-content;max-width:min(48vw,620px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#fff;border:1.5px solid var(--teal);border-radius:999px;
  padding:.5rem .85rem;box-shadow:var(--shadow-sm);font-size:.88rem;color:var(--ink-soft);
  z-index:60;
}
.stage-content{
  min-height:min(64vh,650px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;
}
.recap-prompt{
  font-family:"Andika",sans-serif;font-weight:700;color:var(--teal-ink);
  font-size:clamp(1.15rem,2vw,1.55rem);letter-spacing:.02em;
}
@keyframes sceneEnter{
  0%{opacity:.2;transform:scale(.975);box-shadow:0 0 0 5px rgba(20,184,166,.28)}
  100%{opacity:1;transform:scale(1);box-shadow:var(--shadow-md)}
}
@keyframes photoReveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.scene-frame.scene-enter{animation:sceneEnter .42s ease both}
.helper-pop{
  position:absolute;bottom:calc(100% + .6rem);right:0;
  background:#fff;border:1.5px solid var(--teal);border-radius:12px;
  padding:.75rem .95rem;box-shadow:var(--shadow-md);
  min-width:220px;max-width:340px;text-align:left;
  display:none;z-index:60;
}
.helper-pop.open{display:block}
.helper-pop .hp-close{
  position:absolute;top:.35rem;right:.5rem;width:1.4rem;height:1.4rem;
  border-radius:50%;color:var(--ink-dim);font-size:.9rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.helper-pop .hp-close:hover{background:var(--paper-2);color:var(--ink)}
.helper-pop ul{list-style:none;display:flex;flex-direction:column;gap:.7rem;margin-top:.1rem}
.helper-pop li{font-family:"Andika",sans-serif;font-size:.98rem;color:var(--ink-soft);line-height:1.7}

/* fullscreen mode: hide topbar entirely */
body.fs .topbar{display:none}

/* =====================================================================
   Home
   ===================================================================== */
.home{max-width:760px;margin:0 auto;padding:3.4rem 1.5rem;display:flex;flex-direction:column;gap:1.2rem;flex:1;justify-content:center}
.home-title{font-family:"Andika",sans-serif;font-weight:700;font-size:1.9rem;color:var(--ink);text-align:center}
.home-modes{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.mode-card{
  background:#fff;border:1.5px solid var(--rule);border-radius:var(--r-lg);
  padding:2.1rem 1.3rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.7rem;
  transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease;
}
.mode-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.mode-card .m-icon{width:44px;height:44px;color:var(--teal)}
.mode-card .m-title{font-family:"Andika",sans-serif;font-weight:700;font-size:1.15rem;color:var(--ink)}
.mode-card .m-sub{font-size:.8rem;color:var(--ink-soft)}
.home-foot{display:flex;justify-content:center;gap:1rem;margin-top:.6rem}

/* =====================================================================
   Selector screen
   ===================================================================== */
.selector{max-width:1080px;margin:0 auto;padding:1.3rem 1.5rem 6.5rem;width:100%}
.selector-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.7rem;margin-bottom:1rem}
.selector-title{font-family:"Andika",sans-serif;font-weight:700;font-size:1.3rem}
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.selector-bar{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);
  padding:.85rem 1.4rem;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 -6px 18px rgba(20,24,31,.06);
}
.count-badge{font-family:"Space Mono",monospace;font-size:.85rem;color:var(--ink-soft)}
.count-badge b{color:var(--teal-ink)}

/* =====================================================================
   Teacher edit area (tucked away, never on home)
   ===================================================================== */
.editor-link{
  font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-dim);
}

/* toast */
.toast{
  position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:10px;font-size:.85rem;
  opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =====================================================================
   Responsive
   ===================================================================== */
@media (max-width:720px){
  .home-modes{grid-template-columns:1fr}
  .stage-controls{gap:.35rem}
  .stage-controls .btn{font-size:.8rem;padding:.5rem .8rem}
  .which-row{grid-template-columns:1fr;width:min(94vw,560px)}
  .control-note{position:fixed;left:50%;top:auto;bottom:5.2rem;transform:translateX(-50%);max-width:92vw}
}

@media (min-width:721px) and (max-width:1100px){
  .which-row{grid-template-columns:repeat(2,minmax(260px,1fr));width:min(94vw,920px)}
}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="wordmark en">VOCAB<span class="dot">·</span>TALK</span>

  </header>
  <main id="app-root"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== icons.js =====

// icons.js — small inline SVGs for presentation controls.
// The teacher is the only person operating these, so icons stand alone
// with no Japanese (or English) label next to them.

const ICONS = {
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  peek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  context: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  frame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>',
};

function icon(name) {
  return ICONS[name] || '';
}


// ===== data.js =====

// data.js — loads the provided JSON as-is. Never mutate the source data.

let sceneTargets = null;
let whichOneSets = null;
let appConfig = null;

// Data is embedded directly in this HTML file (see <script type="application/json">
// blocks near the bottom) so the app survives GitHub's drag-and-drop upload flow,
// which does not preserve folder structure for individually-dropped files.
function readEmbeddedJSON(id) {
  const el = document.getElementById(id);
  if (!el) throw new Error('missing embedded data block: ' + id);
  return JSON.parse(el.textContent);
}

async function loadData() {
  if (sceneTargets && whichOneSets && appConfig) {
    return { sceneTargets, whichOneSets, appConfig };
  }
  const scenes = readEmbeddedJSON('vt-data-scene-targets');
  const whichOne = readEmbeddedJSON('vt-data-which-one-sets');
  const config = readEmbeddedJSON('vt-data-app-config');
  // Only items the data itself marks as classroom-ready by default.
  sceneTargets = scenes.filter((s) => s.default_enabled !== false);
  whichOneSets = whichOne;
  appConfig = config;
  return { sceneTargets, whichOneSets, appConfig };
}

// image path convention: assets/scenes/<word>.<ext>
// Tries a few extensions so both hand-made SVGs and photo/illustration
// files (from Codex, etc.) resolve through the same lookup.
// Falls back to a placeholder if no file exists yet.
const EXT_CANDIDATES = ['svg', 'webp', 'png', 'jpg', 'jpeg'];

const resolvedPathCache = new Map();
async function resolveScenePath(item) {
  const base = `assets/scenes/${item.word.replace(/\s+/g, '_')}`;
  if (resolvedPathCache.has(base)) return resolvedPathCache.get(base);
  let found = null;
  for (const ext of EXT_CANDIDATES) {
    const path = `${base}.${ext}`;
    // eslint-disable-next-line no-await-in-loop
    if (await checkImage(path)) { found = path; break; }
  }
  resolvedPathCache.set(base, found);
  return found;
}

const imageExistsCache = new Map();
function checkImage(path) {
  if (imageExistsCache.has(path)) return imageExistsCache.get(path);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = path;
  });
  imageExistsCache.set(path, p);
  return p;
}

function uniqueValues(list, field) {
  const set = new Set();
  list.forEach((item) => {
    const v = item[field];
    if (Array.isArray(v)) v.forEach((x) => set.add(x));
    else if (v) String(v).split(',').forEach((x) => set.add(x.trim()));
  });
  return [...set].sort();
}

function filterScenes(list, { tier, pos, fn } = {}) {
  return list.filter((s) => {
    if (tier && s.tier !== tier) return false;
    if (pos && !s.pos.split(',').map((x) => x.trim()).includes(pos)) return false;
    if (fn && s.function !== fn) return false;
    return true;
  });
}

function filterWhichOne(list, { type } = {}) {
  return list.filter((s) => (type ? s.type === type : true));
}

function sample(list, n) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}


// ===== storage.js =====

// storage.js — teacher's saved sets, localStorage only. No server, no login.
// Key layout:
//   vt_sets_scene      -> [{id, name, ids:[scene_target id...], createdAt}]
//   vt_sets_which_one   -> [{id, name, ids:[which_one_set id...], createdAt}]

const KEY = { scene: 'vt_sets_scene', which_one: 'vt_sets_which_one' };

function readAll(mode) {
  try {
    const raw = localStorage.getItem(KEY[mode]);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn('vt storage read failed', e);
    return [];
  }
}

function writeAll(mode, list) {
  try {
    localStorage.setItem(KEY[mode], JSON.stringify(list));
    return true;
  } catch (e) {
    console.warn('vt storage write failed', e);
    return false;
  }
}

const Storage = {
  list(mode) {
    return readAll(mode).sort((a, b) => b.createdAt - a.createdAt);
  },
  save(mode, name, ids) {
    const list = readAll(mode);
    const entry = {
      id: 'set_' + Date.now().toString(36),
      name: (name || '').trim() || '無題のセット',
      ids,
      createdAt: Date.now(),
    };
    list.push(entry);
    writeAll(mode, list);
    return entry;
  },
  remove(mode, id) {
    const list = readAll(mode).filter((s) => s.id !== id);
    writeAll(mode, list);
  },
  get(mode, id) {
    return readAll(mode).find((s) => s.id === id) || null;
  },
};


// ===== selector.js =====

// selector.js — "10題選択" screen. One job: pick items, then start.

const POS_LABELS = {
  adjective: 'Adjective', verb: 'Verb', noun: 'Noun', adverb: 'Adverb', phrase: 'Phrase',
};

function renderSelector(root, { mode, items, onStart, showToast }) {
  const picked = new Set();
  let filtered = items;
  let activeFilters = {};

  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'selector';

  const head = document.createElement('div');
  head.className = 'selector-head';
  head.innerHTML = `
    <div class="selector-title en">${mode === 'scene' ? 'SCENE / TALK' : 'WHICH ONE?'}</div>
  `;
  const headActions = document.createElement('div');
  headActions.style.display = 'flex';
  headActions.style.gap = '.5rem';

  const randomBtn = btn('btn btn-outline btn-sm', 'ランダム10');
  const clearBtn = btn('btn btn-ghost btn-sm', '選択解除');
  headActions.append(randomBtn, clearBtn);
  head.appendChild(headActions);
  wrap.appendChild(head);

  // ---- filters ----
  const filterRow = document.createElement('div');
  filterRow.className = 'filter-row';
  wrap.appendChild(filterRow);

  if (mode === 'scene') {
    const tiers = uniqueValues(items, 'tier');
    const posList = uniqueValues(items, 'pos');
    filterRow.appendChild(segmented('レベル', ['すべて', ...tiers], (val) => {
      activeFilters.tier = val === 'すべて' ? undefined : val;
      applyFilters();
    }));
    filterRow.appendChild(segmented('品詞', ['すべて', ...posList.filter((p) => POS_LABELS[p] || p.length < 12)], (val) => {
      activeFilters.pos = val === 'すべて' ? undefined : val;
      applyFilters();
    }));
  } else {
    filterRow.appendChild(segmented('種類', ['すべて', 'QUICK', 'MYSTERY'], (val) => {
      activeFilters.type = val === 'すべて' ? undefined : val;
      applyFilters();
    }));
  }

  // ---- saved sets ----
  const savedRow = document.createElement('div');
  savedRow.style.marginBottom = '.9rem';
  wrap.appendChild(savedRow);
  renderSavedSets();

  // ---- grid ----
  const grid = document.createElement('div');
  grid.className = 'grid';
  wrap.appendChild(grid);

  root.appendChild(wrap);

  // ---- bottom bar ----
  const bar = document.createElement('div');
  bar.className = 'selector-bar';
  const countBadge = document.createElement('div');
  countBadge.className = 'count-badge';
  const barActions = document.createElement('div');
  barActions.style.display = 'flex';
  barActions.style.gap = '.5rem';
  const saveBtn = btn('btn btn-outline btn-sm', 'このセットを保存');
  const startBtn = btn('btn btn-primary btn-lg', 'はじめる');
  barActions.append(saveBtn, startBtn);
  bar.append(countBadge, barActions);
  root.appendChild(bar);

  function segmented(label, options, onChange) {
    const box = document.createElement('div');
    box.style.display = 'flex';
    box.style.flexDirection = 'column';
    box.style.gap = '.25rem';
    const lab = document.createElement('span');
    lab.className = 'eyebrow';
    lab.textContent = label;
    const seg = document.createElement('div');
    seg.className = 'segmented';
    options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = POS_LABELS[opt] || opt;
      if (i === 0) b.classList.add('on');
      b.onclick = () => {
        [...seg.children].forEach((c) => c.classList.remove('on'));
        b.classList.add('on');
        onChange(opt);
      };
      seg.appendChild(b);
    });
    box.append(lab, seg);
    return box;
  }

  function btn(cls, text) {
    const b = document.createElement('button');
    b.className = cls;
    b.textContent = text;
    return b;
  }

  function applyFilters() {
    filtered = mode === 'scene' ? filterScenes(items, activeFilters) : filterWhichOne(items, activeFilters);
    renderGrid();
  }

  function renderGrid() {
    grid.innerHTML = '';
    filtered.forEach((item) => {
      const tile = document.createElement('button');
      tile.className = 'tile' + (picked.has(item.id) ? ' picked' : '');
      tile.type = 'button';
      if (mode === 'scene') {
        tile.innerHTML = `
          <div class="tile-word en">${item.word}</div>
          <div class="tile-ja">${item.japanese}</div>
          <div class="tile-tags"><span class="tag">${item.tier}</span><span class="tag">${item.function}</span></div>
          <span class="tile-check"></span>
        `;
      } else {
        tile.innerHTML = `
          <div class="tile-word en">${item.words.join(' · ')}</div>
          <div class="tile-ja">${item.type}${item.label ? ' · ' + item.label : ''}</div>
          <span class="tile-check"></span>
        `;
      }
      tile.onclick = () => {
        if (picked.has(item.id)) picked.delete(item.id);
        else picked.add(item.id);
        tile.classList.toggle('picked');
        updateCount();
      };
      grid.appendChild(tile);
    });
  }

  function renderSavedSets() {
    const sets = Storage.list(mode);
    savedRow.innerHTML = '';
    if (!sets.length) return;
    const lab = document.createElement('span');
    lab.className = 'eyebrow';
    lab.textContent = '保存したセット';
    lab.style.display = 'block';
    lab.style.marginBottom = '.4rem';
    savedRow.appendChild(lab);
    const chips = document.createElement('div');
    chips.style.display = 'flex';
    chips.style.gap = '.5rem';
    chips.style.flexWrap = 'wrap';
    sets.forEach((s) => {
      const chip = document.createElement('button');
      chip.className = 'btn btn-outline btn-sm';
      chip.textContent = `${s.name} (${s.ids.length})`;
      chip.onclick = () => {
        picked.clear();
        s.ids.forEach((id) => picked.add(id));
        renderGrid();
        updateCount();
      };
      const del = document.createElement('button');
      del.className = 'btn btn-ghost btn-sm';
      del.textContent = '×';
      del.title = '削除';
      del.onclick = (e) => {
        e.stopPropagation();
        Storage.remove(mode, s.id);
        renderSavedSets();
      };
      const group = document.createElement('span');
      group.style.display = 'inline-flex';
      group.append(chip, del);
      chips.appendChild(group);
    });
    savedRow.appendChild(chips);
  }

  function updateCount() {
    countBadge.innerHTML = `<b>${picked.size}</b> 問選択中`;
    startBtn.disabled = picked.size === 0;
    saveBtn.disabled = picked.size === 0;
  }

  randomBtn.onclick = () => {
    picked.clear();
    sample(filtered, Math.min(10, filtered.length)).forEach((it) => picked.add(it.id));
    renderGrid();
    updateCount();
  };
  clearBtn.onclick = () => {
    picked.clear();
    renderGrid();
    updateCount();
  };
  saveBtn.onclick = () => {
    const name = prompt('セット名を入力してください');
    if (name === null) return;
    Storage.save(mode, name, [...picked]);
    renderSavedSets();
    showToast('セットを保存しました');
  };
  startBtn.onclick = () => {
    const list = items.filter((it) => picked.has(it.id));
    if (list.length) onStart(list);
  };

  applyFilters();
  updateCount();
}


// ===== scene.js =====

// scene.js — the main event. Teacher presses Reveal / Next. Nothing auto-advances.
// Controls are icon-only: the teacher is the only person operating this screen.

const STAGES = ['scene', 'word', 'model', 'recap'];

function renderScene(root, { items, onExit, showToast }) {
  let index = 0;
  let stageIdx = 0; // position within STAGES
  let hintOpen = false;
  let helperOpen = false;

  root.innerHTML = '';
  const stage = document.createElement('div');
  stage.className = 'stage';

  const progress = document.createElement('div');
  progress.className = 'stage-progress mono';
  const exitBtn = document.createElement('button');
  exitBtn.className = 'icon-btn ghost icon-btn-sm stage-exit';
  exitBtn.innerHTML = icon('close');
  exitBtn.setAttribute('aria-label', '終了');
  exitBtn.onclick = () => { if (window.confirm('終了しますか？')) onExit(); };

  const content = document.createElement('div');
  content.className = 'stage-content';

  stage.append(progress, exitBtn, content);
  root.appendChild(stage);

  const controls = document.createElement('div');
  controls.className = 'stage-controls';
  root.appendChild(controls);

  const helper = document.createElement('div');
  helper.className = 'helper-pop';

  function currentItem() {
    return items[index];
  }

  async function buildFrame(item, isNewScene = false) {
    const frame = document.createElement('div');
    frame.className = 'scene-frame';
    if (isNewScene) frame.classList.add('scene-enter');
    const path = await resolveScenePath(item);
    if (path) {
      frame.innerHTML = `<img src="${path}" alt="">`;
    } else {
      frame.innerHTML = `<div class="scene-placeholder">${icon('frame')}<span>SCENE ${item.image_status === 'TO_CREATE' ? '準備中' : ''}</span></div>`;
    }
    return frame;
  }

  async function renderContent() {
    const item = currentItem();
    content.innerHTML = '';
    progress.textContent = `${index + 1} / ${items.length}`;
    hintOpen = false;

    if (stageIdx === 0) {
      // SCENE — image maximized, nothing else, teacher can toggle a hint caption
      content.appendChild(await buildFrame(item, true));

      const hintBox = document.createElement('div');
      hintBox.className = 'reveal-chunk';
      hintBox.style.minHeight = '1.4em';
      content.appendChild(hintBox);
    } else if (stageIdx === 1) {
      // WORD
      const w = document.createElement('div');
      w.className = 'reveal-word en';
      w.innerHTML = `${item.word}<span class="ja">${item.japanese}</span>`;
      content.appendChild(w);
    } else if (stageIdx === 2) {
      // MODEL
      const chunk = document.createElement('div');
      chunk.className = 'reveal-chunk en';
      chunk.textContent = item.chunk;
      const m = document.createElement('div');
      m.className = 'reveal-model en';
      m.textContent = item.model_sentence;
      content.append(chunk, m);
    } else {
      // RECAP — the scene again, no labels at all. The class already knows the
      // word and sentence; this is their chance to produce it once more, unaided.
      const prompt = document.createElement('div');
      prompt.className = 'recap-prompt en';
      prompt.textContent = 'What would you say in this situation?';
      content.append(prompt, await buildFrame(item));
    }
    renderControls();
  }

  function slot(el) {
    const s = document.createElement('div');
    s.className = 'ctrl-slot';
    s.appendChild(el);
    return s;
  }

  function renderControls() {
    controls.innerHTML = '';

    controls.appendChild(slot(iconBtn('outline', 'prev', () => go(-1), index === 0 && stageIdx === 0, '前へ')));

    const hintBtn = iconBtn('outline' + (hintOpen ? ' on' : ''), 'hint', () => toggleHint(), false, 'ヒント');
    if (stageIdx !== 0) {
      hintBtn.style.visibility = 'hidden';
      hintBtn.tabIndex = -1;
    }
    controls.appendChild(slot(hintBtn));

    let nextBtn;
    if (stageIdx < STAGES.length - 1) {
      nextBtn = iconBtn('primary', 'next', () => { stageIdx += 1; renderContent(); }, false, '次へ');
    } else {
      const isLast = index === items.length - 1;
      nextBtn = iconBtn('primary', isLast ? 'close' : 'next', () => {
        if (isLast) { if (window.confirm('終了しますか？')) onExit(); return; }
        go(1);
      }, false, isLast ? '終了' : '次のシーンへ');
    }
    controls.appendChild(slot(nextBtn));

    const anchor = document.createElement('div');
    anchor.className = 'helper-anchor';
    anchor.appendChild(iconBtn('ghost' + (helperOpen ? ' on' : ''), 'context', () => toggleHelper(), false, '場面設定'));
    anchor.appendChild(helper);
    controls.appendChild(slot(anchor));

    renderHelper();
  }

  function toggleHint() {
    hintOpen = !hintOpen;
    const box = content.querySelector('.reveal-chunk');
    if (box) box.textContent = hintOpen ? currentItem().teacher_prompt : '';
    renderControls();
  }

  function toggleHelper() {
    helperOpen = !helperOpen;
    renderControls();
  }

  function renderHelper() {
    const item = currentItem();
    helper.className = 'control-note';
    helper.textContent = item.scene_idea;
    helper.hidden = !helperOpen;
  }

  function iconBtn(cls, iconName, onClick, disabled = false, label = '') {
    const b = document.createElement('button');
    b.className = 'icon-btn ' + cls;
    b.innerHTML = icon(iconName);
    b.disabled = disabled;
    if (label) b.setAttribute('aria-label', label);
    b.onclick = onClick;
    return b;
  }

  function go(dir) {
    helperOpen = false;
    helper.classList.remove('open');
    if (dir > 0) {
      index += 1;
      stageIdx = 0;
    } else {
      if (stageIdx > 0) {
        stageIdx -= 1;
      } else if (index > 0) {
        index -= 1;
        stageIdx = STAGES.length - 1;
      }
    }
    renderContent();
  }

  renderContent();
}


// ===== which-one.js =====

// which-one.js — WORDS -> answer check. 2x2 grid, order shuffled per item so
// the "different one" isn't always in the same spot.

function renderWhichOne(root, { items, onExit }) {
  const STAGES = ['words', 'pictures', 'ideas'];
  let index = 0;
  let stageIdx = 0;
  let helperOpen = false;
  const shuffledCache = new Map();

  root.innerHTML = '';
  const stage = document.createElement('div');
  stage.className = 'stage';

  const progress = document.createElement('div');
  progress.className = 'stage-progress mono';
  const exitBtn = document.createElement('button');
  exitBtn.className = 'icon-btn ghost icon-btn-sm stage-exit';
  exitBtn.innerHTML = icon('close');
  exitBtn.setAttribute('aria-label', '終了');
  exitBtn.onclick = () => { if (window.confirm('終了しますか？')) onExit(); };

  const content = document.createElement('div');
  content.className = 'stage-content';

  stage.append(progress, exitBtn, content);
  root.appendChild(stage);

  const controls = document.createElement('div');
  controls.className = 'stage-controls';
  root.appendChild(controls);

  const helper = document.createElement('div');
  helper.className = 'helper-pop';

  const COLORS = ['var(--teal-soft)', 'var(--blue-soft)', 'var(--amber-soft)', 'var(--paper-2)'];

  function currentItem() {
    return items[index];
  }

  function displayWords(item) {
    if (!shuffledCache.has(item.id)) {
      const arr = [...item.words];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      shuffledCache.set(item.id, arr);
    }
    return shuffledCache.get(item.id);
  }

  async function renderContent() {
    const item = currentItem();
    progress.textContent = `${index + 1} / ${items.length}`;
    content.innerHTML = '';
    helperOpen = false;
    helper.classList.remove('open');

    if (stageIdx <= 1) {
      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = 'Which one? Why?';

      const row = document.createElement('div');
      row.className = 'which-row';
      content.append(eyebrow, row);

      const words = displayWords(item);
      const cells = words.map((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'which-cell';
        cell.style.background = COLORS[i % COLORS.length];
        const frame = document.createElement('div');
        frame.className = 'which-cell-frame';
        frame.innerHTML = `<div class="scene-placeholder">${icon('frame')}</div>`;
        const label = document.createElement('div');
        label.className = 'which-word en';
        label.textContent = w;
        cell.append(frame, label);
        row.appendChild(cell);
        return { word: w, frame };
      });

      // Stage 0 deliberately keeps the four images hidden. The teacher reveals
      // them together, then advances once more for answer checking.
      if (stageIdx === 1) {
        cells.forEach(async ({ word, frame }) => {
          const path = await resolveScenePath({ word });
          if (path) {
            frame.classList.add('photo-reveal');
            frame.innerHTML = `<img src="${path}" alt="">`;
          }
        });
      }
    } else {
      // answer check — shown big, on purpose, after the class has already talked it through.
      // Visual first, text last: an image for the answer word (when there is one), then the word, then the ideas.
      const wrap = document.createElement('div');
      wrap.className = 'ideas-wrap';
      if (item.suggested_answer) {
        const frame = document.createElement('div');
        frame.className = 'which-image-frame';
        const path = await resolveScenePath({ word: item.suggested_answer });
        frame.innerHTML = path
          ? `<img src="${path}" alt="">`
          : `<div class="scene-placeholder">${icon('frame')}<span>準備中</span></div>`;
        wrap.appendChild(frame);

        const ans = document.createElement('div');
        ans.className = 'idea-answer en';
        ans.textContent = item.suggested_answer;
        wrap.appendChild(ans);
      }
      const list = document.createElement('div');
      list.className = 'idea-list';
      (item.sample_ideas || []).forEach((idea) => {
        const line = document.createElement('div');
        line.className = 'idea-line en';
        line.textContent = idea;
        list.appendChild(line);
      });
      wrap.appendChild(list);
      content.appendChild(wrap);
    }
    renderControls();
  }

  function slot(el) {
    const s = document.createElement('div');
    s.className = 'ctrl-slot';
    s.appendChild(el);
    return s;
  }

  function renderControls() {
    controls.innerHTML = '';
    controls.appendChild(slot(iconBtn('outline', 'prev', () => go(-1), index === 0 && stageIdx === 0, '前へ')));

    let nextBtn;
    if (stageIdx === 0) {
      nextBtn = iconBtn('primary', 'peek', () => { stageIdx = 1; renderContent(); }, false, '写真を表示');
    } else if (stageIdx === 1) {
      nextBtn = iconBtn('primary', 'next', () => { stageIdx = 2; renderContent(); }, false, '答え合わせ');
    } else {
      const isLast = index === items.length - 1;
      nextBtn = iconBtn('primary', isLast ? 'close' : 'next', () => {
        if (isLast) { if (window.confirm('終了しますか？')) onExit(); return; }
        go(1);
      }, false, isLast ? '終了' : '次のセットへ');
    }
    controls.appendChild(slot(nextBtn));

    const anchor = document.createElement('div');
    anchor.className = 'helper-anchor';
    const peekBtn = iconBtn('ghost' + (helperOpen ? ' on' : ''), 'context', () => toggleHelper(), false, '分類・想定解');
    if (stageIdx > 1) {
      peekBtn.style.visibility = 'hidden';
      peekBtn.tabIndex = -1;
    }
    anchor.appendChild(peekBtn);
    anchor.appendChild(helper);
    controls.appendChild(slot(anchor));

    if (stageIdx <= 1) renderHelper();
  }

  function toggleHelper() {
    helperOpen = !helperOpen;
    helper.classList.toggle('open', helperOpen);
  }

  function renderHelper() {
    const item = currentItem();
    const lines = [item.suggested_answer, ...(item.sample_ideas || [])].filter(Boolean);
    helper.innerHTML = `
      <button class="hp-close" type="button" aria-label="close">×</button>
      <ul>${lines.map((l) => `<li>${l}</li>`).join('')}</ul>
    `;
    helper.querySelector('.hp-close').onclick = () => toggleHelper();
  }

  function iconBtn(cls, iconName, onClick, disabled = false, label = '') {
    const b = document.createElement('button');
    b.className = 'icon-btn ' + cls;
    b.innerHTML = icon(iconName);
    b.disabled = disabled;
    if (label) b.setAttribute('aria-label', label);
    b.onclick = onClick;
    return b;
  }

  function go(dir) {
    if (dir > 0) {
      index += 1;
      stageIdx = 0;
    } else if (stageIdx > 0) {
      stageIdx -= 1;
    } else if (index > 0) {
      index -= 1;
      stageIdx = STAGES.length - 1;
    }
    renderContent();
  }

  renderContent();
}


// ===== app.js =====


const root = document.getElementById('app-root');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function goHome() {
  document.body.classList.remove('fs');
  exitFullscreenIfActive();
  renderHome();
}

function exitFullscreenIfActive() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

async function enterFullscreen() {
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    // fullscreen not available (e.g. iOS Safari) — presentation styling still applies
  }
  document.body.classList.add('fs');
}

function renderHome() {
  root.innerHTML = `
    <div class="home">
      <div class="home-title en">What do you want to do today?</div>
      <div class="home-modes">
        <button class="mode-card" data-mode="scene">
          <div class="m-title en">SCENE / TALK</div>
        </button>
        <button class="mode-card" data-mode="which_one">
          <div class="m-title en">WHICH ONE?</div>
        </button>
      </div>
      <div class="home-foot">
        <span class="editor-link">v1.0 · MEXT curriculum aligned vocabulary</span>
      </div>
    </div>
  `;
  root.querySelectorAll('.mode-card').forEach((el) => {
    el.addEventListener('click', () => openSelector(el.dataset.mode));
  });
}

async function openSelector(mode) {
  const { sceneTargets, whichOneSets } = await loadData();
  const items = mode === 'scene' ? sceneTargets : whichOneSets;
  renderSelector(root, {
    mode,
    items,
    showToast,
    onStart: (chosen) => openPresentation(mode, chosen),
  });
}

async function openPresentation(mode, chosen) {
  await enterFullscreen();
  const onExit = () => goHome();
  if (mode === 'scene') {
    renderScene(root, { items: chosen, onExit, showToast });
  } else {
    renderWhichOne(root, { items: chosen, onExit, showToast });
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('fs');
});

document.querySelector('.brand').addEventListener('click', () => goHome());

renderHome();

</script>
